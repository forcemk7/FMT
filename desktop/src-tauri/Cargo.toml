[package]
name = "fmt"
version = "0.1.27"
description = "Read-only desktop recruitment workspace for Football Manager 2026"
authors = ["FMT"]
edition = "2021"
default-run = "fmt"

[features]
default = []
# RE / probe helpers archive. Default build stays quiet (`allow(dead_code)`).
# Research: `cargo check --features fm-probe` (dead_code warnings on again).
# New probe-only code: `#[cfg(feature = "fm-probe")]` — see `.cursor/rules/fm-probe-gate.mdc`.
fm-probe = []

[lib]
name = "glassscout_fm26_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
